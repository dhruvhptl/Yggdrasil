<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yggdrasil Leaf Placement Playground</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: #0a0a0a; color: #e0e0e0;
    display: flex; height: 100vh; overflow: hidden;
  }

  /* ── Controls Panel ── */
  #controls {
    width: 310px; min-width: 310px;
    background: #111; border-right: 1px solid #222;
    overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 12px;
  }
  #controls h1 { font-size: 14px; color: #fff; margin-bottom: 4px; letter-spacing: 0.03em; }
  #controls h2 {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em;
    color: #666; margin-top: 8px; margin-bottom: 4px;
    border-bottom: 1px solid #1a1a1a; padding-bottom: 4px;
  }
  .ctrl-row {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .ctrl-row label { font-size: 11px; color: #999; white-space: nowrap; }
  .ctrl-row input[type="range"] { flex: 1; max-width: 140px; accent-color: #4a9; }
  .ctrl-row .val { font-size: 11px; color: #6d9; font-family: monospace; min-width: 36px; text-align: right; }
  .ctrl-row select {
    background: #1a1a1a; border: 1px solid #333; color: #ccc;
    font-size: 11px; padding: 3px 6px; border-radius: 4px;
  }

  /* Presets */
  #presets { display: flex; gap: 6px; flex-wrap: wrap; }
  #presets button {
    font-size: 10px; padding: 4px 10px;
    background: #1a1a1a; border: 1px solid #333; color: #aaa;
    border-radius: 4px; cursor: pointer; transition: all 0.15s;
  }
  #presets button:hover { background: #252525; color: #fff; border-color: #555; }
  #presets button.active { background: #1a3a2a; border-color: #4a9; color: #6d9; }

  /* Color swatches */
  .color-row { display: flex; align-items: center; gap: 6px; }
  .color-row label { font-size: 11px; color: #999; min-width: 60px; }
  .color-row input[type="color"] {
    width: 28px; height: 22px; border: 1px solid #333;
    background: none; cursor: pointer; border-radius: 3px;
  }

  /* ── Preview Area ── */
  #preview-area {
    flex: 1; display: flex; flex-direction: column; position: relative;
    background: #050805;
  }
  canvas {
    flex: 1; cursor: crosshair;
  }

  /* Tooltip */
  #tooltip {
    position: absolute; pointer-events: none;
    background: #1a1a2aee; border: 1px solid #334; border-radius: 6px;
    padding: 6px 10px; font-size: 11px; color: #ccc;
    display: none; z-index: 50; max-width: 200px;
    box-shadow: 0 4px 12px #0005;
  }
  #tooltip .tt-title { font-weight: 600; color: #fff; margin-bottom: 2px; }
  #tooltip .tt-phase { font-size: 9px; text-transform: uppercase; letter-spacing: 0.06em; }

  /* ── Prompt Output ── */
  #prompt-area {
    background: #0d0d0d; border-top: 1px solid #222;
    padding: 12px 16px; display: flex; flex-direction: column; gap: 6px;
    max-height: 160px;
  }
  #prompt-area .header {
    display: flex; justify-content: space-between; align-items: center;
  }
  #prompt-area .header span { font-size: 10px; color: #666; text-transform: uppercase; letter-spacing: 0.08em; }
  #copy-btn {
    font-size: 10px; padding: 3px 10px;
    background: #1a3a2a; border: 1px solid #4a9; color: #6d9;
    border-radius: 4px; cursor: pointer;
  }
  #copy-btn:hover { background: #2a4a3a; }
  #prompt-text {
    font-size: 11px; color: #aaa; line-height: 1.5;
    font-family: monospace; white-space: pre-wrap;
    overflow-y: auto; max-height: 100px;
  }

  /* Legend */
  #legend {
    position: absolute; bottom: 12px; left: 12px;
    background: #111a; border: 1px solid #222; border-radius: 6px;
    padding: 8px 12px; font-size: 10px; display: flex; flex-direction: column; gap: 4px;
    z-index: 10;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-swatch { width: 14px; height: 8px; border-radius: 3px; }

  /* Info bar */
  #info-bar {
    position: absolute; top: 8px; right: 12px;
    font-size: 10px; color: #555; z-index: 10;
  }
</style>
</head>
<body>

<div id="controls">
  <h1>Yggdrasil Leaf Playground</h1>

  <h2>Presets</h2>
  <div id="presets">
    <button onclick="applyPreset('natural')">Natural</button>
    <button onclick="applyPreset('dense')">Dense Canopy</button>
    <button onclick="applyPreset('sparse')">Sparse</button>
    <button onclick="applyPreset('wide')">Wide Leaves</button>
    <button onclick="applyPreset('pointed')">Pointed</button>
  </div>

  <h2>Tree Structure</h2>
  <div class="ctrl-row">
    <label>Seed</label>
    <input type="range" min="1" max="200" value="42" oninput="s.seed=+this.value;u()" id="c-seed">
    <span class="val" id="v-seed">42</span>
  </div>
  <div class="ctrl-row">
    <label>Target leaves</label>
    <input type="range" min="8" max="60" value="24" oninput="s.targetLeaves=+this.value;u()" id="c-targetLeaves">
    <span class="val" id="v-targetLeaves">24</span>
  </div>
  <div class="ctrl-row">
    <label>Branch length</label>
    <input type="range" min="80" max="220" value="145" oninput="s.branchLength=+this.value;u()" id="c-branchLength">
    <span class="val" id="v-branchLength">145</span>
  </div>
  <div class="ctrl-row">
    <label>Trunk height</label>
    <input type="range" min="100" max="400" value="320" oninput="s.trunkHeight=+this.value;u()" id="c-trunkHeight">
    <span class="val" id="v-trunkHeight">320</span>
  </div>

  <h2>Leaf Shape</h2>
  <div class="ctrl-row">
    <label>Size</label>
    <input type="range" min="6" max="30" value="14" step="1" oninput="s.leafSize=+this.value;u()" id="c-leafSize">
    <span class="val" id="v-leafSize">14</span>
  </div>
  <div class="ctrl-row">
    <label>Width ratio</label>
    <input type="range" min="0.2" max="0.9" value="0.45" step="0.05" oninput="s.leafWidth=+this.value;u()" id="c-leafWidth">
    <span class="val" id="v-leafWidth">0.45</span>
  </div>
  <div class="ctrl-row">
    <label>Pointiness</label>
    <input type="range" min="0.1" max="0.6" value="0.3" step="0.05" oninput="s.leafPoint=+this.value;u()" id="c-leafPoint">
    <span class="val" id="v-leafPoint">0.30</span>
  </div>
  <div class="ctrl-row">
    <label>Curve</label>
    <input type="range" min="0" max="0.5" value="0.15" step="0.05" oninput="s.leafCurve=+this.value;u()" id="c-leafCurve">
    <span class="val" id="v-leafCurve">0.15</span>
  </div>
  <div class="ctrl-row">
    <label>Angle variance</label>
    <input type="range" min="0" max="90" value="30" oninput="s.leafAngleVar=+this.value;u()" id="c-leafAngleVar">
    <span class="val" id="v-leafAngleVar">30&deg;</span>
  </div>
  <div class="ctrl-row">
    <label>Show vein</label>
    <input type="range" min="0" max="1" value="1" step="1" oninput="s.showVein=+this.value;u()" id="c-showVein">
    <span class="val" id="v-showVein">on</span>
  </div>

  <h2>Placement</h2>
  <div class="ctrl-row">
    <label>Inner density</label>
    <input type="range" min="0" max="1" value="0.5" step="0.05" oninput="s.innerDensity=+this.value;u()" id="c-innerDensity">
    <span class="val" id="v-innerDensity">0.50</span>
  </div>
  <div class="ctrl-row">
    <label>Min spacing</label>
    <input type="range" min="10" max="80" value="35" oninput="s.minSpacing=+this.value;u()" id="c-minSpacing">
    <span class="val" id="v-minSpacing">35</span>
  </div>
  <div class="ctrl-row">
    <label>Repulsion iters</label>
    <input type="range" min="0" max="50" value="15" oninput="s.repulsionIters=+this.value;u()" id="c-repulsionIters">
    <span class="val" id="v-repulsionIters">15</span>
  </div>
  <div class="ctrl-row">
    <label>Tether strength</label>
    <input type="range" min="0" max="1" value="0.3" step="0.05" oninput="s.tetherStrength=+this.value;u()" id="c-tetherStrength">
    <span class="val" id="v-tetherStrength">0.30</span>
  </div>
  <div class="ctrl-row">
    <label>Inner→Outer spread</label>
    <input type="range" min="0" max="1" value="0.6" step="0.05" oninput="s.depthSpread=+this.value;u()" id="c-depthSpread">
    <span class="val" id="v-depthSpread">0.60</span>
  </div>

  <h2>Labels</h2>
  <div class="ctrl-row">
    <label>Show labels</label>
    <select onchange="s.labelMode=this.value;u()" id="c-labelMode">
      <option value="hover">On hover only</option>
      <option value="always">Always visible</option>
      <option value="phases">Phases only</option>
      <option value="none">Hidden</option>
    </select>
  </div>
  <div class="ctrl-row">
    <label>Label size</label>
    <input type="range" min="8" max="16" value="10" oninput="s.labelSize=+this.value;u()" id="c-labelSize">
    <span class="val" id="v-labelSize">10</span>
  </div>

  <h2>Phase Colors</h2>
  <div class="color-row"><label>Phase 1</label><input type="color" value="#10b981" onchange="s.colors[0]=this.value;u()" id="c-color0"></div>
  <div class="color-row"><label>Phase 2</label><input type="color" value="#c8a94a" onchange="s.colors[1]=this.value;u()" id="c-color1"></div>
  <div class="color-row"><label>Phase 3</label><input type="color" value="#4a9eff" onchange="s.colors[2]=this.value;u()" id="c-color2"></div>
  <div class="color-row"><label>Phase 4</label><input type="color" value="#a855f7" onchange="s.colors[3]=this.value;u()" id="c-color3"></div>
  <div class="color-row"><label>Phase 5</label><input type="color" value="#ef4444" onchange="s.colors[4]=this.value;u()" id="c-color4"></div>

  <h2>States Preview</h2>
  <div class="ctrl-row">
    <label>Completed %</label>
    <input type="range" min="0" max="100" value="30" oninput="s.completedPct=+this.value;u()" id="c-completedPct">
    <span class="val" id="v-completedPct">30%</span>
  </div>
  <div class="ctrl-row">
    <label>Locked %</label>
    <input type="range" min="0" max="100" value="20" oninput="s.lockedPct=+this.value;u()" id="c-lockedPct">
    <span class="val" id="v-lockedPct">20%</span>
  </div>
  <div class="ctrl-row">
    <label>Completed glow</label>
    <input type="range" min="0" max="30" value="12" oninput="s.glowRadius=+this.value;u()" id="c-glowRadius">
    <span class="val" id="v-glowRadius">12</span>
  </div>
  <div class="ctrl-row">
    <label>Locked opacity</label>
    <input type="range" min="0.05" max="0.5" value="0.2" step="0.05" oninput="s.lockedOpacity=+this.value;u()" id="c-lockedOpacity">
    <span class="val" id="v-lockedOpacity">0.20</span>
  </div>
</div>

<div id="preview-area">
  <canvas id="canvas"></canvas>
  <div id="tooltip">
    <div class="tt-title"></div>
    <div class="tt-phase"></div>
  </div>
  <div id="legend"></div>
  <div id="info-bar"></div>
</div>

<div id="prompt-area">
  <div class="header">
    <span>Generated Prompt</span>
    <button id="copy-btn" onclick="copyPrompt()">Copy</button>
  </div>
  <div id="prompt-text"></div>
</div>

<script>
// ══════════════════════════════════════════════════════════════════════════════
// State
// ══════════════════════════════════════════════════════════════════════════════

const DEFAULTS = {
  seed: 42,
  targetLeaves: 24,
  branchLength: 145,
  trunkHeight: 320,
  leafSize: 14,
  leafWidth: 0.45,
  leafPoint: 0.3,
  leafCurve: 0.15,
  leafAngleVar: 30,
  showVein: 1,
  innerDensity: 0.5,
  minSpacing: 35,
  repulsionIters: 15,
  tetherStrength: 0.3,
  depthSpread: 0.6,
  labelMode: 'hover',
  labelSize: 10,
  colors: ['#10b981','#c8a94a','#4a9eff','#a855f7','#ef4444'],
  completedPct: 30,
  lockedPct: 20,
  glowRadius: 12,
  lockedOpacity: 0.2,
};

const s = { ...DEFAULTS, colors: [...DEFAULTS.colors] };

const PRESETS = {
  natural: { seed:42, targetLeaves:24, branchLength:145, trunkHeight:320, leafSize:14, leafWidth:0.45, leafPoint:0.3, leafCurve:0.15, leafAngleVar:30, showVein:1, innerDensity:0.5, minSpacing:35, repulsionIters:15, tetherStrength:0.3, depthSpread:0.6 },
  dense:   { seed:42, targetLeaves:45, branchLength:130, trunkHeight:300, leafSize:11, leafWidth:0.4, leafPoint:0.25, leafCurve:0.1, leafAngleVar:40, showVein:1, innerDensity:0.7, minSpacing:22, repulsionIters:25, tetherStrength:0.2, depthSpread:0.5 },
  sparse:  { seed:42, targetLeaves:14, branchLength:160, trunkHeight:340, leafSize:18, leafWidth:0.5, leafPoint:0.35, leafCurve:0.2, leafAngleVar:25, showVein:1, innerDensity:0.2, minSpacing:50, repulsionIters:10, tetherStrength:0.4, depthSpread:0.7 },
  wide:    { seed:42, targetLeaves:24, branchLength:145, trunkHeight:320, leafSize:16, leafWidth:0.7, leafPoint:0.2, leafCurve:0.2, leafAngleVar:35, showVein:1, innerDensity:0.5, minSpacing:40, repulsionIters:15, tetherStrength:0.3, depthSpread:0.6 },
  pointed: { seed:42, targetLeaves:24, branchLength:145, trunkHeight:320, leafSize:16, leafWidth:0.3, leafPoint:0.45, leafCurve:0.1, leafAngleVar:20, showVein:1, innerDensity:0.5, minSpacing:35, repulsionIters:15, tetherStrength:0.3, depthSpread:0.6 },
};

// ══════════════════════════════════════════════════════════════════════════════
// Seeded RNG (same as YggdrasilTree.tsx)
// ══════════════════════════════════════════════════════════════════════════════

class RNG {
  constructor(seed) { this.s = seed % 2147483647; if (this.s <= 0) this.s += 2147483646; }
  next() { this.s = (this.s * 16807) % 2147483647; return (this.s - 1) / 2147483646; }
  range(a, b) { return a + this.next() * (b - a); }
}

// ══════════════════════════════════════════════════════════════════════════════
// L-System Tree Generation (matches YggdrasilTree.tsx)
// ══════════════════════════════════════════════════════════════════════════════

// Sample a point along a cubic bezier at parameter t
function bezierPoint(x1,y1, cp1x,cp1y, cp2x,cp2y, x2,y2, t) {
  const u = 1 - t;
  return {
    x: u*u*u*x1 + 3*u*u*t*cp1x + 3*u*t*t*cp2x + t*t*t*x2,
    y: u*u*u*y1 + 3*u*u*t*cp1y + 3*u*t*t*cp2y + t*t*t*y2,
  };
}
// Tangent angle of cubic bezier at parameter t
function bezierAngle(x1,y1, cp1x,cp1y, cp2x,cp2y, x2,y2, t) {
  const u = 1 - t;
  const dx = 3*u*u*(cp1x-x1) + 6*u*t*(cp2x-cp1x) + 3*t*t*(x2-cp2x);
  const dy = 3*u*u*(cp1y-y1) + 6*u*t*(cp2y-cp1y) + 3*t*t*(y2-cp2y);
  return Math.atan2(dy, dx);
}

function growTree(minThickness, seed, cfg) {
  const rng = new RNG(seed);
  const branches = [];
  const tips = [];
  const thicknessScale = 0.64;
  const lengthScale = 0.72;
  const initThick = 24;

  function grow(x, y, angle, thickness, length, depth) {
    if (thickness < minThickness) {
      tips.push({ x, y, angle, depth });
      return;
    }
    const n = depth === 0 ? Math.round(rng.range(3, 5)) : Math.round(rng.range(2, 3));
    const spreadDeg = depth === 0 ? 110 : depth === 1 ? 70 : depth === 2 ? 50 : 35;
    const spreadRad = spreadDeg * Math.PI / 180;

    for (let i = 0; i < n; i++) {
      const t = n === 1 ? 0.5 : i / (n - 1);
      let childAngle = angle - spreadRad / 2 + t * spreadRad + rng.range(-0.12, 0.12);
      childAngle = Math.max(-Math.PI * 0.97, Math.min(-Math.PI * 0.03, childAngle));
      const childLen = length * lengthScale * rng.range(0.88, 1.12);
      const ex = x + childLen * Math.cos(childAngle);
      const ey = y + childLen * Math.sin(childAngle);
      const perp = childAngle + Math.PI / 2;
      const w1 = rng.range(-18, 18), w2 = rng.range(-12, 12);
      branches.push({
        x1: x, y1: y, x2: ex, y2: ey,
        cp1x: x + childLen * 0.35 * Math.cos(childAngle) + w1 * Math.cos(perp),
        cp1y: y + childLen * 0.35 * Math.sin(childAngle) + w1 * Math.sin(perp),
        cp2x: ex - childLen * 0.25 * Math.cos(childAngle) + w2 * Math.cos(perp),
        cp2y: ey - childLen * 0.25 * Math.sin(childAngle) + w2 * Math.sin(perp),
        thickness: thickness * thicknessScale, depth,
      });
      grow(ex, ey, childAngle, thickness * thicknessScale, childLen, depth + 1);
    }
  }

  const baseX = cfg.baseX, baseY = cfg.baseY, topY = cfg.topY;
  const mx = baseX + rng.range(-6, 6);
  branches.push({
    x1: baseX, y1: baseY, x2: baseX, y2: topY,
    cp1x: mx + 8, cp1y: baseY - 100, cp2x: mx - 6, cp2y: topY + 90,
    thickness: initThick, depth: -1,
  });
  grow(baseX, topY, -Math.PI / 2, initThick * thicknessScale, cfg.branchLen, 0);
  tips.sort((a, b) => a.depth - b.depth || a.x - b.x);
  return { branches, tips };
}

function generateTree(targetTips, seed, cfg) {
  let lo = 0.3, hi = 4.0, best = { branches: [], tips: [] }, bestDiff = Infinity;
  for (let i = 0; i < 14; i++) {
    const mid = (lo + hi) / 2;
    const r = growTree(mid, seed, cfg);
    const d = Math.abs(r.tips.length - targetTips);
    if (d < bestDiff) { bestDiff = d; best = r; }
    if (d <= 3) break;
    if (r.tips.length < targetTips) hi = mid; else lo = mid;
  }
  return best;
}

// ══════════════════════════════════════════════════════════════════════════════
// Leaf placement: tips → positioned leaves with depth-based ordering
// ══════════════════════════════════════════════════════════════════════════════

function sortTipsByAngle(tips, cx, cy) {
  return [...tips].sort((a, b) => Math.atan2(a.y - cy, a.x - cx) - Math.atan2(b.y - cy, b.x - cx));
}

function placeLeavesOnTips(tips, cfg, branches) {
  const cx = cfg.baseX, cy = cfg.topY;
  const sorted = sortTipsByAngle(tips, cx, cy);
  const rng = new RNG(cfg.seed + 777);

  // ── Reassign some leaves to inner branches based on innerDensity ──
  // innerDensity=0: all leaves at tips (original behavior)
  // innerDensity=1: all leaves relocated to inner branches (depth 0-2)
  const relocRng = new RNG(cfg.seed + 888);
  const innerBranches = branches.filter(b => b.depth >= 0 && b.depth <= 2 && b.thickness > 1.5);

  const allPoints = sorted.map(tip => {
    // Each leaf has a chance of being relocated proportional to innerDensity
    if (s.innerDensity <= 0 || innerBranches.length === 0 || relocRng.next() > s.innerDensity) {
      return { x: tip.x, y: tip.y, angle: tip.angle, depth: tip.depth };
    }

    // Pick a random inner branch and place the leaf along it
    const b = innerBranches[Math.floor(relocRng.range(0, innerBranches.length))];
    const t = relocRng.range(0.25, 0.85);
    const pt = bezierPoint(b.x1,b.y1, b.cp1x,b.cp1y, b.cp2x,b.cp2y, b.x2,b.y2, t);
    const angle = bezierAngle(b.x1,b.y1, b.cp1x,b.cp1y, b.cp2x,b.cp2y, b.x2,b.y2, t);
    // Offset perpendicular so leaf isn't hidden behind the branch stroke
    const perpAngle = angle + (relocRng.next() > 0.5 ? Math.PI/2 : -Math.PI/2);
    const offset = relocRng.range(4, 12);
    return {
      x: pt.x + Math.cos(perpAngle) * offset,
      y: pt.y + Math.sin(perpAngle) * offset,
      angle: angle,
      depth: b.depth,
    };
  });

  // Assign phase index based on depth (inner = early phase, outer = late)
  const byDist = allPoints.map((pt, origIdx) => {
    const dx = pt.x - cx, dy = pt.y - cy;
    return { pt, origIdx, dist: Math.sqrt(dx * dx + dy * dy), depth: pt.depth };
  });

  // Mix depth and distance for progression ordering
  const ds = s.depthSpread;
  const maxDist = Math.max(...byDist.map(t => t.dist)) || 1;
  const maxDepth = Math.max(...byDist.map(t => t.depth)) || 1;
  byDist.forEach(t => {
    t.progressScore = (1 - ds) * (t.depth / maxDepth) + ds * (t.dist / maxDist);
  });
  byDist.sort((a, b) => a.progressScore - b.progressScore);

  const totalLeaves = allPoints.length;
  const numPhases = s.colors.length;

  // Build leaf placements
  const leaves = byDist.map((item, sortedIdx) => {
    const pt = item.pt;
    const phaseIdx = Math.min(numPhases - 1, Math.floor(sortedIdx / totalLeaves * numPhases));
    const angleVar = s.leafAngleVar * Math.PI / 180;
    const leafAngle = pt.angle + rng.range(-angleVar, angleVar);

    // Determine state for preview
    let state = 'active';
    if (sortedIdx < totalLeaves * s.completedPct / 100) state = 'completed';
    else if (sortedIdx >= totalLeaves * (1 - s.lockedPct / 100)) state = 'locked';

    return {
      x: pt.x, y: pt.y,
      origX: pt.x, origY: pt.y,
      angle: leafAngle,
      branchAngle: pt.angle,
      phaseIdx,
      leafIdx: sortedIdx,
      state,
      title: `Checkpoint ${sortedIdx + 1}`,
      phaseTitle: `Phase ${phaseIdx + 1}`,
      depth: pt.depth,
      isDecorative: false,
    };
  });

  // ── Repulsion pass — push along the arc (tangent to circle from trunk top) ──
  for (let iter = 0; iter < s.repulsionIters; iter++) {
    for (let i = 0; i < leaves.length; i++) {
      for (let j = i + 1; j < leaves.length; j++) {
        const dx = leaves[j].x - leaves[i].x;
        const dy = leaves[j].y - leaves[i].y;
        const dist = Math.sqrt(dx * dx + dy * dy) || 0.1;
        if (dist < s.minSpacing) {
          const force = (s.minSpacing - dist) / 2 * 0.4;

          // For each leaf, compute the tangent direction (perpendicular to radial from trunk top)
          // This makes repulsion slide leaves along the canopy arc, not fly off into space
          for (const [leaf, sign] of [[leaves[i], -1], [leaves[j], 1]]) {
            const rdx = leaf.x - cx, rdy = leaf.y - cy;
            const rLen = Math.sqrt(rdx * rdx + rdy * rdy) || 1;
            // Tangent = perpendicular to radial: (-rdy, rdx) normalized
            // Choose direction based on which side this leaf is relative to the other
            const tangentX = -rdy / rLen;
            const tangentY = rdx / rLen;
            // Determine which tangent direction to push (dot product with repulsion vector)
            const repDx = sign * dx / dist;
            const repDy = sign * dy / dist;
            const dot = repDx * tangentX + repDy * tangentY;
            const dir = dot >= 0 ? 1 : -1;
            leaf.x += dir * tangentX * force;
            leaf.y += dir * tangentY * force;
          }
        }
      }
      // Tether back to original position
      const tether = s.tetherStrength;
      leaves[i].x += (leaves[i].origX - leaves[i].x) * tether;
      leaves[i].y += (leaves[i].origY - leaves[i].y) * tether;
    }
  }

  return leaves;
}

// ══════════════════════════════════════════════════════════════════════════════
// Canvas drawing
// ══════════════════════════════════════════════════════════════════════════════

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H;
let currentLeaves = [];
let hoveredLeaf = null;
let selectedLeaf = null;

function resize() {
  const r = canvas.parentElement.getBoundingClientRect();
  W = r.width; H = r.height;
  canvas.width = W * devicePixelRatio;
  canvas.height = H * devicePixelRatio;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
}

function drawBg() {
  const g = ctx.createRadialGradient(W * 0.5, H * 0.85, 0, W * 0.5, H * 0.85, W * 0.9);
  g.addColorStop(0, '#0d1a0d');
  g.addColorStop(0.5, '#070d07');
  g.addColorStop(1, '#020402');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function drawBranches(branches) {
  const sorted = [...branches].sort((a, b) => b.thickness - a.thickness);
  sorted.forEach(b => {
    const t = b.thickness;
    const dark = Math.max(10, 35 - b.depth * 3);
    ctx.beginPath();
    ctx.moveTo(b.x1, b.y1);
    ctx.bezierCurveTo(b.cp1x, b.cp1y, b.cp2x, b.cp2y, b.x2, b.y2);
    ctx.strokeStyle = `rgb(${dark},${Math.round(dark*0.65)},${Math.round(dark*0.25)})`;
    ctx.lineWidth = Math.max(0.5, t);
    ctx.lineCap = 'round';
    ctx.stroke();
    if (t > 4) {
      ctx.beginPath();
      ctx.moveTo(b.x1+1, b.y1);
      ctx.bezierCurveTo(b.cp1x+2, b.cp1y, b.cp2x-1, b.cp2y, b.x2+1, b.y2);
      ctx.strokeStyle = `rgba(${dark+8},${Math.round(dark*0.65)+5},${Math.round(dark*0.25)+2},0.35)`;
      ctx.lineWidth = Math.max(1, t * 0.4);
      ctx.stroke();
    }
  });
}

// ── Draw a single botanical leaf shape ──
function drawLeaf(x, y, angle, size, color, state, isHovered, isSelected) {
  const w = size * s.leafWidth;  // half-width
  const len = size;              // length from base to tip
  const pointOff = len * s.leafPoint; // how far the widest point is from base
  const curve = s.leafCurve * size;   // lateral curve amount

  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);

  // State-based styling
  let fillColor, strokeColor, alpha;
  if (state === 'completed') {
    fillColor = color;
    strokeColor = '#ffffffaa';
    alpha = 1;
  } else if (state === 'locked') {
    fillColor = '#111';
    strokeColor = '#333';
    alpha = s.lockedOpacity;
  } else {
    fillColor = color + '99';
    strokeColor = color + 'cc';
    alpha = 0.85;
  }

  ctx.globalAlpha = alpha;

  // Glow for completed
  if (state === 'completed' && s.glowRadius > 0) {
    const glow = ctx.createRadialGradient(len * 0.4, 0, 2, len * 0.4, 0, s.glowRadius + size);
    glow.addColorStop(0, color + '44');
    glow.addColorStop(1, color + '00');
    ctx.beginPath();
    ctx.arc(len * 0.4, 0, s.glowRadius + size, 0, Math.PI * 2);
    ctx.fillStyle = glow;
    ctx.fill();
  }

  // Hover glow
  if (isHovered) {
    const hg = ctx.createRadialGradient(len * 0.4, 0, 2, len * 0.4, 0, size * 2);
    hg.addColorStop(0, color + '55');
    hg.addColorStop(1, color + '00');
    ctx.beginPath();
    ctx.arc(len * 0.4, 0, size * 2, 0, Math.PI * 2);
    ctx.fillStyle = hg;
    ctx.fill();
  }

  // Selection ring
  if (isSelected) {
    ctx.beginPath();
    ctx.arc(len * 0.4, 0, size * 1.3, 0, Math.PI * 2);
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.globalAlpha = 0.8;
    ctx.stroke();
    ctx.globalAlpha = alpha;
  }

  // Leaf body — two cubic beziers (top half + bottom half)
  ctx.beginPath();
  // Start at base (stem attachment)
  ctx.moveTo(0, 0);
  // Top curve: base → widest point → tip
  ctx.bezierCurveTo(
    pointOff * 0.3, -(w * 0.5 + curve),   // cp1
    pointOff,       -(w + curve * 0.5),     // cp2 (widest)
    len,            0                        // tip
  );
  // Bottom curve: tip → widest point → base
  ctx.bezierCurveTo(
    pointOff,       (w + curve * 0.5),      // cp1 (widest)
    pointOff * 0.3, (w * 0.5 + curve),      // cp2
    0,              0                        // back to base
  );
  ctx.closePath();

  ctx.fillStyle = fillColor;
  ctx.fill();
  ctx.strokeStyle = strokeColor;
  ctx.lineWidth = isHovered ? 1.8 : 1;
  ctx.stroke();

  // Vein (midrib)
  if (s.showVein) {
    ctx.beginPath();
    ctx.moveTo(1, 0);
    ctx.lineTo(len * 0.85, 0);
    ctx.strokeStyle = state === 'locked' ? '#222' : (state === 'completed' ? '#ffffff44' : color + '55');
    ctx.lineWidth = 0.6;
    ctx.stroke();

    // Side veins
    const veinCount = Math.max(2, Math.floor(size / 5));
    for (let v = 1; v <= veinCount; v++) {
      const t = v / (veinCount + 1);
      const vx = len * t * 0.85;
      const vw = w * (1 - t * 0.6) * 0.6;
      ctx.beginPath();
      ctx.moveTo(vx, 0);
      ctx.quadraticCurveTo(vx + len * 0.06, -vw * 0.6, vx + len * 0.12, -vw);
      ctx.strokeStyle = state === 'locked' ? '#1a1a1a' : (state === 'completed' ? '#ffffff22' : color + '33');
      ctx.lineWidth = 0.4;
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(vx, 0);
      ctx.quadraticCurveTo(vx + len * 0.06, vw * 0.6, vx + len * 0.12, vw);
      ctx.stroke();
    }
  }

  // Stem connecting back to branch
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(-size * 0.4, 0);
  ctx.strokeStyle = '#1a1008';
  ctx.lineWidth = 1.2;
  ctx.stroke();

  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawLabels(leaves) {
  if (s.labelMode === 'none') return;

  const cx = W * 0.5;
  const showAll = s.labelMode === 'always';
  const phasesOnly = s.labelMode === 'phases';

  if (showAll) {
    leaves.forEach(leaf => {
      const lbl = leaf.title.length > 22 ? leaf.title.slice(0, 22) + '...' : leaf.title;
      ctx.font = `400 ${s.labelSize}px -apple-system, sans-serif`;
      ctx.fillStyle = leaf.state === 'locked' ? '#333' : leaf.state === 'completed' ? '#ccc' : '#888';
      ctx.textBaseline = 'middle';
      const offset = s.leafSize + 10;
      if (leaf.x > cx) {
        ctx.textAlign = 'left';
        ctx.fillText(lbl, leaf.x + offset, leaf.y);
      } else {
        ctx.textAlign = 'right';
        ctx.fillText(lbl, leaf.x - offset, leaf.y);
      }
    });
  }

  // Phase labels — group by phase, place at centroid
  if (showAll || phasesOnly) {
    const phaseGroups = {};
    leaves.forEach(l => {
      if (!phaseGroups[l.phaseIdx]) phaseGroups[l.phaseIdx] = [];
      phaseGroups[l.phaseIdx].push(l);
    });

    Object.entries(phaseGroups).forEach(([idx, group]) => {
      const pi = +idx;
      const avgX = group.reduce((s, l) => s + l.x, 0) / group.length;
      const minY = Math.min(...group.map(l => l.y));
      const color = s.colors[pi % s.colors.length];

      ctx.font = `600 ${s.labelSize + 3}px -apple-system, sans-serif`;
      ctx.fillStyle = color + 'cc';
      ctx.textAlign = avgX > cx ? 'left' : 'right';
      ctx.textBaseline = 'bottom';
      ctx.fillText(`Phase ${pi + 1}`, avgX, minY - 12);

      // Subtle underline
      const textW = ctx.measureText(`Phase ${pi + 1}`).width;
      const startX = avgX > cx ? avgX : avgX - textW;
      ctx.beginPath();
      ctx.moveTo(startX, minY - 9);
      ctx.lineTo(startX + textW, minY - 9);
      ctx.strokeStyle = color + '44';
      ctx.lineWidth = 1;
      ctx.stroke();
    });
  }

  // Hover tooltip handled separately
  ctx.textAlign = 'left';
}

function render() {
  resize();
  const cfg = {
    baseX: W * 0.5,
    baseY: H * 0.95,
    topY: H * 0.95 - s.trunkHeight,
    branchLen: s.branchLength,
    seed: s.seed,
  };

  const { branches, tips } = generateTree(s.targetLeaves, s.seed, cfg);
  currentLeaves = placeLeavesOnTips(tips, cfg, branches);

  drawBg();
  drawBranches(branches);

  // Draw leaves
  currentLeaves.forEach((leaf, i) => {
    const color = s.colors[leaf.phaseIdx % s.colors.length];
    drawLeaf(
      leaf.x, leaf.y, leaf.angle,
      s.leafSize, color, leaf.state,
      hoveredLeaf === i, selectedLeaf === i,
    );
  });

  drawLabels(currentLeaves);

  // Info
  document.getElementById('info-bar').textContent =
    `${currentLeaves.length} leaves | ${s.colors.length} phases`;

  // Legend
  const legendEl = document.getElementById('legend');
  legendEl.innerHTML = s.colors.map((c, i) =>
    `<div class="legend-item"><div class="legend-swatch" style="background:${c}"></div>Phase ${i+1}</div>`
  ).join('') +
    '<div class="legend-item"><div class="legend-swatch" style="background:#555"></div>Locked</div>' +
    '<div class="legend-item"><div class="legend-swatch" style="background:#fff;opacity:0.8"></div>Completed</div>';
}

// ══════════════════════════════════════════════════════════════════════════════
// Interaction — hover & click
// ══════════════════════════════════════════════════════════════════════════════

const tooltip = document.getElementById('tooltip');

canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  let found = -1;
  let minDist = Infinity;

  currentLeaves.forEach((leaf, i) => {
    const dx = leaf.x - mx, dy = leaf.y - my;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < s.leafSize * 1.5 && dist < minDist) {
      minDist = dist;
      found = i;
    }
  });

  if (found !== hoveredLeaf) {
    hoveredLeaf = found;
    render();
  }

  if (found >= 0) {
    const leaf = currentLeaves[found];
    tooltip.style.display = 'block';
    tooltip.style.left = (e.clientX - canvas.parentElement.getBoundingClientRect().left + 14) + 'px';
    tooltip.style.top = (e.clientY - canvas.parentElement.getBoundingClientRect().top - 10) + 'px';
    tooltip.querySelector('.tt-title').textContent = leaf.title;
    tooltip.querySelector('.tt-phase').textContent = leaf.phaseTitle + ' | ' + leaf.state;
    tooltip.querySelector('.tt-phase').style.color = s.colors[leaf.phaseIdx % s.colors.length];
    canvas.style.cursor = 'pointer';
  } else {
    tooltip.style.display = 'none';
    canvas.style.cursor = 'crosshair';
  }
});

canvas.addEventListener('click', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  let found = -1;
  let minDist = Infinity;

  currentLeaves.forEach((leaf, i) => {
    const dx = leaf.x - mx, dy = leaf.y - my;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < s.leafSize * 1.5 && dist < minDist) {
      minDist = dist;
      found = i;
    }
  });

  selectedLeaf = found >= 0 ? found : null;
  render();
});

canvas.addEventListener('mouseleave', () => {
  hoveredLeaf = null;
  tooltip.style.display = 'none';
  render();
});

// ══════════════════════════════════════════════════════════════════════════════
// Controls sync & prompt
// ══════════════════════════════════════════════════════════════════════════════

function u() {
  // Sync values to display
  document.getElementById('v-seed').textContent = s.seed;
  document.getElementById('v-targetLeaves').textContent = s.targetLeaves;
  document.getElementById('v-branchLength').textContent = s.branchLength;
  document.getElementById('v-trunkHeight').textContent = s.trunkHeight;
  document.getElementById('v-leafSize').textContent = s.leafSize;
  document.getElementById('v-leafWidth').textContent = s.leafWidth.toFixed(2);
  document.getElementById('v-leafPoint').textContent = s.leafPoint.toFixed(2);
  document.getElementById('v-leafCurve').textContent = s.leafCurve.toFixed(2);
  document.getElementById('v-leafAngleVar').textContent = s.leafAngleVar + '\u00b0';
  document.getElementById('v-showVein').textContent = s.showVein ? 'on' : 'off';
  document.getElementById('v-innerDensity').textContent = s.innerDensity.toFixed(2);
  document.getElementById('v-minSpacing').textContent = s.minSpacing;
  document.getElementById('v-repulsionIters').textContent = s.repulsionIters;
  document.getElementById('v-tetherStrength').textContent = s.tetherStrength.toFixed(2);
  document.getElementById('v-depthSpread').textContent = s.depthSpread.toFixed(2);
  document.getElementById('v-labelSize').textContent = s.labelSize;
  document.getElementById('v-completedPct').textContent = s.completedPct + '%';
  document.getElementById('v-lockedPct').textContent = s.lockedPct + '%';
  document.getElementById('v-glowRadius').textContent = s.glowRadius;
  document.getElementById('v-lockedOpacity').textContent = s.lockedOpacity.toFixed(2);

  updatePrompt();
  render();
}

function applyPreset(name) {
  const p = PRESETS[name];
  if (!p) return;
  Object.entries(p).forEach(([k, v]) => { s[k] = v; });

  // Sync controls
  ['seed','targetLeaves','branchLength','trunkHeight','leafSize','leafWidth','leafPoint',
   'leafCurve','leafAngleVar','showVein','innerDensity','minSpacing','repulsionIters','tetherStrength',
   'depthSpread','labelSize'].forEach(k => {
    const el = document.getElementById('c-' + k);
    if (el) el.value = s[k];
  });
  document.getElementById('c-labelMode').value = s.labelMode;

  // Highlight active preset
  document.querySelectorAll('#presets button').forEach(b => b.classList.remove('active'));
  document.querySelector(`#presets button[onclick*="${name}"]`)?.classList.add('active');

  u();
}

function updatePrompt() {
  const D = DEFAULTS;
  const parts = [];

  // Leaf shape
  const shapeParts = [];
  if (s.leafSize !== D.leafSize) shapeParts.push(`size ${s.leafSize}px`);
  if (s.leafWidth !== D.leafWidth) shapeParts.push(`width ratio ${s.leafWidth}`);
  if (s.leafPoint !== D.leafPoint) shapeParts.push(`pointiness ${s.leafPoint}`);
  if (s.leafCurve !== D.leafCurve) shapeParts.push(`curve ${s.leafCurve}`);
  if (shapeParts.length) parts.push(`Leaf shape: ${shapeParts.join(', ')}.`);

  // Placement
  const placeParts = [];
  if (s.innerDensity !== D.innerDensity) placeParts.push(`inner branch density ${s.innerDensity}`);
  if (s.minSpacing !== D.minSpacing) placeParts.push(`minimum spacing of ${s.minSpacing}px`);
  if (s.repulsionIters !== D.repulsionIters) placeParts.push(`${s.repulsionIters} repulsion iterations`);
  if (s.tetherStrength !== D.tetherStrength) placeParts.push(`tether strength ${s.tetherStrength}`);
  if (s.depthSpread !== D.depthSpread) placeParts.push(`inner-to-outer spread ${s.depthSpread}`);
  if (placeParts.length) parts.push(`Placement: ${placeParts.join(', ')}.`);

  // Tree structure
  const treeParts = [];
  if (s.seed !== D.seed) treeParts.push(`seed ${s.seed}`);
  if (s.branchLength !== D.branchLength) treeParts.push(`branch length ${s.branchLength}`);
  if (s.trunkHeight !== D.trunkHeight) treeParts.push(`trunk height ${s.trunkHeight}`);
  if (treeParts.length) parts.push(`Tree: ${treeParts.join(', ')}.`);

  // Colors
  const colorsDiff = s.colors.some((c, i) => c !== D.colors[i]);
  if (colorsDiff) parts.push(`Phase colors: ${s.colors.join(', ')}.`);

  // States
  if (s.glowRadius !== D.glowRadius) parts.push(`Completed glow radius: ${s.glowRadius}px.`);
  if (s.lockedOpacity !== D.lockedOpacity) parts.push(`Locked leaf opacity: ${s.lockedOpacity}.`);

  // Labels
  if (s.labelMode !== D.labelMode) parts.push(`Labels: ${s.labelMode}.`);
  if (s.labelSize !== D.labelSize) parts.push(`Label font size: ${s.labelSize}px.`);

  const promptEl = document.getElementById('prompt-text');
  if (parts.length === 0) {
    promptEl.textContent = 'Using default settings. Adjust controls to customize.';
  } else {
    promptEl.textContent =
      `Update YggdrasilTree.tsx to render checkpoints as organic leaf shapes instead of circles.\n\n` +
      `Configuration:\n${parts.join('\n')}\n\n` +
      `Key behaviors:\n` +
      `- Foundational checkpoints sit on inner branches (near trunk), advanced on outer tips\n` +
      `- Each leaf is clickable — opens checkpoint panel\n` +
      `- Hover shows title tooltip with glow\n` +
      `- Completed leaves: full color + glow. Locked: dark silhouette. Active: semi-transparent color\n` +
      `- Leaf shape: botanical form with midrib vein and side veins\n` +
      `- Repulsion-based spacing prevents overlap while keeping leaves tethered to branch tips\n` +
      `- Phase labels float above their cluster as colored text badges`;
  }
}

function copyPrompt() {
  const text = document.getElementById('prompt-text').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('copy-btn');
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = 'Copy', 1500);
  });
}

// ══════════════════════════════════════════════════════════════════════════════
// Init
// ══════════════════════════════════════════════════════════════════════════════

window.addEventListener('resize', () => { render(); });
applyPreset('natural');
</script>
